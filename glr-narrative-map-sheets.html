<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narrative Map – Great Lakes Review</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>

  <!-- Google Fonts — matching GLR site: Source Sans Pro + Roboto Condensed -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Source+Sans+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #404040;
      --blue:      #4877D6;
      --blue-lt:   #c5d4f5;
      --paper:     #ffffff;
      --bg:        #f8f8f8;
      --border:    #e5e5e5;
      --muted:     #666666;
    }

    body {
      font-family: 'Source Sans Pro', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    /* ── Header ── */
    .glr-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 1.1rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--paper);
    }

    .glr-header h1 {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: .02em;
      color: var(--blue);
      text-transform: uppercase;
    }

    .glr-header .rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
    }

    .glr-header .byline {
      font-size: .78rem;
      color: var(--muted);
      font-style: italic;
      white-space: nowrap;
    }

    /* ── Layout ── */
    .glr-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 68px);
    }

    /* ── Sidebar ── */
    .glr-sidebar {
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }

    .sidebar-intro {
      padding: 1.2rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-intro p {
      font-size: .875rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .sidebar-intro p strong {
      color: var(--ink);
      font-weight: 600;
    }

    .essay-list {
      list-style: none;
      flex: 1;
    }

    .essay-item {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }

    .essay-item:hover,
    .essay-item.active {
      background: #f0f4fd;
    }

    .essay-item.active .essay-lake-tag {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .essay-inner {
      padding: 1rem 1.5rem;
    }

    .essay-lake-tag {
      display: inline-block;
      font-size: .65rem;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--blue);
      border: 1px solid var(--blue-lt);
      border-radius: 2px;
      padding: .15rem .45rem;
      margin-bottom: .5rem;
      transition: background .15s, color .15s, border-color .15s;
    }

    .essay-title {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: .3rem;
    }

    .essay-meta {
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: .4rem;
    }

    .essay-excerpt {
      font-size: .82rem;
      line-height: 1.58;
      color: var(--muted);
    }

    .essay-link {
      display: inline-block;
      margin-top: .55rem;
      font-size: .78rem;
      font-weight: 600;
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid var(--blue-lt);
      transition: border-color .15s;
    }

    .essay-link:hover { border-color: var(--blue); }

    /* ── Map ── */
    #map {
      width: 100%;
      height: 100%;
      background: #c8dde8;
    }

    /* Mapbox GL attribution */
    .mapboxgl-ctrl-attrib { font-size: .65rem; }
    .mapboxgl-ctrl-home {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      background: #fff;
      border: none;
      cursor: pointer;
      color: #333;
      padding: 0;
    }
    .mapboxgl-ctrl-home:hover { background: #f0f0f0; }
    .mapboxgl-popup-content {
      border-radius: 3px;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
      border: 1px solid var(--border);
      background: var(--paper);
      font-family: 'Source Sans Pro', sans-serif;
      padding: 1rem 1.1rem;
      max-width: 280px;
    }
    .mapboxgl-popup-tip { border-top-color: var(--paper) !important; }
    .mapboxgl-popup-close-button {
      font-size: 1.1rem;
      color: var(--muted);
      padding: .2rem .4rem;
    }

    /* ── Popup content ── */

    .popup-tag {
      font-size: .68rem;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .popup-title {
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: 600;
      font-size: .98rem;
      line-height: 1.3;
      margin: .3rem 0 .2rem;
      color: var(--ink);
    }

    .popup-author {
      font-size: .78rem;
      color: var(--muted);
      font-style: italic;
      margin-bottom: .5rem;
    }

    .popup-excerpt {
      font-size: .8rem;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: .6rem;
    }

    .popup-link {
      font-size: .78rem;
      font-weight: 600;
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid var(--blue-lt);
    }

    .popup-link:hover { border-color: var(--blue); }

    /* ── Scrollbar ── */
    .glr-sidebar::-webkit-scrollbar { width: 5px; }
    .glr-sidebar::-webkit-scrollbar-track { background: transparent; }
    .glr-sidebar::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      .glr-layout { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
      #map { height: 100%; }
      .glr-sidebar { height: 100%; }
    }
  </style>
</head>
<body>

<header class="glr-header">
  <h1>Narrative Map</h1>
  <div class="rule"></div>
  <span class="byline">Great Lakes Review</span>
</header>

<div class="glr-layout">

  <!-- Sidebar -->
  <aside class="glr-sidebar">
    <div class="sidebar-intro">
      <p><strong>Read the region.</strong> Each essay is written about a place in the Great Lakes watershed. Click a piece to find it on the map, then take a walk with it.</p>
    </div>
    <ul class="essay-list" id="essayList"></ul>
  </aside>

  <!-- Map -->
  <div id="map"></div>

</div>

<script>
  // ── Configuration — update these two values for GLR's account ────────────
  const MAPBOX_TOKEN = 'pk.eyJ1Ijoic2ZyYW1lOTM4IiwiYSI6ImNqN2RweG9ydjBkenIycWt5Z2c5NWtsajcifQ.bA0BviPhPcygQREBZd0cdQ';
  const MAPBOX_STYLE = 'mapbox://styles/sframe938/cmn39x4gy004101s3h9saa7j7/draft';

  // Google Sheet published as CSV
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4Xa8go-K4opVSNtB_N_qzEF2aEEtxYbvWl4FCeKZfVnbVkEnA1c9AMfrO99RDnIAWNrlIyv6-8eFD/pub?output=csv';

  async function fetchSheet() {
    return fetch(SHEET_CSV_URL);
  }

  // ── Expected sheet columns (order matters) ───────────────────────────────
  // title | author | lake | location | url | excerpt | date | lat | lng
  // lat and lng are optional — if blank, location is geocoded automatically

  // ── Map init ──────────────────────────────────────────────────────────────
  mapboxgl.accessToken = MAPBOX_TOKEN;

  const HOME_CENTER = [-85.276, 44.7];
  const HOME_ZOOM   = 5.33;

  const GL_BOUNDS = [
    [-95.0, 40.5],
    [-73.5, 49.5]
  ];

  const map = new mapboxgl.Map({
    container: 'map',
    style: MAPBOX_STYLE,
    center: HOME_CENTER,
    zoom: HOME_ZOOM,
    minZoom: 4.5,
    maxZoom: 14,
    maxBounds: GL_BOUNDS,
    attributionControl: true
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  // ── Home button ───────────────────────────────────────────────────────────
  class HomeControl {
    onAdd(map) {
      this._map = map;
      this._container = document.createElement('div');
      this._container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group';
      this._container.innerHTML = `
        <button class="mapboxgl-ctrl-home" title="Return to full extent" aria-label="Return to full extent">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
            <polyline points="9 21 9 13 15 13 15 21"/>
          </svg>
        </button>
      `;
      this._container.querySelector('button').addEventListener('click', () => {
        map.flyTo({ center: HOME_CENTER, zoom: HOME_ZOOM, speed: 1.1 });
        document.querySelectorAll('.essay-item').forEach(el => el.classList.remove('active'));
      });
      return this._container;
    }
    onRemove() {
      this._container.parentNode.removeChild(this._container);
      this._map = undefined;
    }
  }
  map.addControl(new HomeControl(), 'top-right');

  // ── CSV parser — handles multi-line quoted fields ────────────────────────
  function parseCSV(text) {
    // Normalize line endings
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

    const rows = [];
    let i = 0;

    function parseField() {
      if (text[i] === '"') {
        // Quoted field — read until closing quote
        i++; // skip opening quote
        let field = '';
        while (i < text.length) {
          if (text[i] === '"' && text[i + 1] === '"') {
            field += '"'; i += 2; // escaped quote
          } else if (text[i] === '"') {
            i++; break; // closing quote
          } else {
            field += text[i++];
          }
        }
        return field;
      } else {
        // Unquoted field — read until comma or newline
        let field = '';
        while (i < text.length && text[i] !== ',' && text[i] !== '\n') {
          field += text[i++];
        }
        return field;
      }
    }

    function parseRow() {
      const cols = [];
      while (i < text.length && text[i] !== '\n') {
        cols.push(parseField());
        if (text[i] === ',') i++; // skip comma
      }
      if (text[i] === '\n') i++; // skip newline
      return cols;
    }

    const headerCols = parseRow();
    const headers = headerCols.map(h => h.trim());

    while (i < text.length) {
      const cols = parseRow();
      if (cols.length < 2) continue; // skip blank lines
      const row = {};
      headers.forEach((h, j) => {
        let val = (cols[j] || '').trim();
        // Collapse internal newlines in excerpts to a single space
        val = val.replace(/\n+/g, ' ').replace(/  +/g, ' ');
        row[h] = val;
      });
      if (row.title) rows.push(row);
    }
    return rows;
  }

  // ── Geocoder — uses Mapbox Geocoding API ──────────────────────────────────
  async function geocode(locationString) {
    const query = encodeURIComponent(locationString + ', Great Lakes');
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${query}.json` +
                `?access_token=${MAPBOX_TOKEN}&limit=1&bbox=-95,40,-73,50`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.features && data.features.length > 0) {
      const [lng, lat] = data.features[0].center;
      return { lat, lng };
    }
    return null;
  }

  // ── Loading state ─────────────────────────────────────────────────────────
  function showLoading() {
    const list = document.getElementById('essayList');
    list.innerHTML = `
      <li style="padding:1.5rem;color:var(--muted);font-size:.85rem;text-align:center;">
        <div style="margin-bottom:.5rem;">Loading essays…</div>
        <div style="width:32px;height:3px;background:var(--blue-lt);margin:0 auto;border-radius:2px;overflow:hidden;">
          <div style="width:100%;height:100%;background:var(--blue);animation:loading 1s ease-in-out infinite alternate;transform-origin:left;"></div>
        </div>
      </li>`;
  }

  function showError(msg) {
    const list = document.getElementById('essayList');
    list.innerHTML = `<li style="padding:1.5rem;color:#c0392b;font-size:.85rem;">${msg}</li>`;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function makePopupHTML(e) {
    return `
      <div class="popup-tag">${e.lake} · ${e.location}</div>
      <div class="popup-title">${e.title}</div>
      <div class="popup-author">by ${e.author} &middot; ${e.date}</div>
      <div class="popup-excerpt">${e.excerpt}</div>
      <a class="popup-link" href="${e.url}" target="_blank" rel="noopener">Read the essay →</a>
    `;
  }

  function activateSidebarItem(id) {
    document.querySelectorAll('.essay-item').forEach(el => el.classList.remove('active'));
    const el = document.getElementById(`essay-${id}`);
    if (el) {
      el.classList.add('active');
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // ── Main — fetch sheet, geocode, render ───────────────────────────────────
  async function loadEssays() {
    showLoading();

    let rows;
    try {
      const res = await fetchSheet();
      if (!res.ok) throw new Error('Could not load sheet');
      const text = await res.text();
      rows = parseCSV(text);
    } catch(err) {
      showError('Could not load essay data. Please check the sheet URL.');
      console.error(err);
      return;
    }

    // Resolve coordinates — use sheet values if present, otherwise geocode
    const essays = await Promise.all(rows.map(async (row, i) => {
      let lat = parseFloat(row.lat || row[7]);
      let lng = parseFloat(row.lng || row[8]);

      if (!lat || !lng) {
        const coords = await geocode(row.location);
        if (coords) { lat = coords.lat; lng = coords.lng; }
        else { console.warn(`Could not geocode: ${row.location}`); return null; }
      }

      return { id: i + 1, lat, lng, ...row };
    }));

    const validEssays = essays.filter(Boolean);

    // Build GeoJSON from essays
    const geojson = {
      type: 'FeatureCollection',
      features: validEssays.map(e => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [e.lng, e.lat] },
        properties: { id: e.id, title: e.title, author: e.author,
                      lake: e.lake, location: e.location, url: e.url,
                      excerpt: e.excerpt, date: e.date }
      }))
    };

    // Store essays by id for reliable lookup (avoids GeoJSON property encoding issues)
    const essayMap = {};
    validEssays.forEach(e => { essayMap[e.id] = e; });

    // Single reusable popup instance
    const activePopup = new mapboxgl.Popup({ offset: 15, maxWidth: '290px', closeOnClick: false });

    function openPopup(essay) {
      activePopup
        .setLngLat([essay.lng, essay.lat])
        .setHTML(makePopupHTML(essay))
        .addTo(map);
    }

    const addLayers = () => {
      // Add GeoJSON source — only store id in properties, look up rest from essayMap
      map.addSource('essays', {
        type: 'geojson',
        data: {
          type: 'FeatureCollection',
          features: validEssays.map(e => ({
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [e.lng, e.lat] },
            properties: { id: e.id }
          }))
        }
      });

      // Shadow layer for depth
      map.addLayer({
        id: 'essays-shadow',
        type: 'circle',
        source: 'essays',
        paint: {
          'circle-radius': 10,
          'circle-color': 'rgba(0,0,0,0.15)',
          'circle-blur': 1,
          'circle-translate': [1, 2]
        }
      });

      // Main marker layer — GPU rendered, no zoom lag
      map.addLayer({
        id: 'essays-markers',
        type: 'circle',
        source: 'essays',
        paint: {
          'circle-radius': [
            'interpolate', ['linear'], ['zoom'],
            4, 5, 8, 8, 12, 11
          ],
          'circle-color': '#4877D6',
          'circle-stroke-width': 2,
          'circle-stroke-color': '#ffffff'
        }
      });

      // Hover highlight layer
      map.addLayer({
        id: 'essays-markers-hover',
        type: 'circle',
        source: 'essays',
        paint: {
          'circle-radius': [
            'interpolate', ['linear'], ['zoom'],
            4, 7, 8, 10, 12, 14
          ],
          'circle-color': '#2557c7',
          'circle-stroke-width': 2,
          'circle-stroke-color': '#ffffff',
          'circle-opacity': 0
        }
      });

      // Click — look up essay from essayMap, not GeoJSON properties
      map.on('click', 'essays-markers', (e) => {
        e.preventDefault();
        const id = e.features[0].properties.id;
        const essay = essayMap[id];
        if (!essay) return;
        activateSidebarItem(id);
        openPopup(essay);
      });

      // Close popup on map click outside markers
      map.on('click', (e) => {
        if (!map.queryRenderedFeatures(e.point, { layers: ['essays-markers'] }).length) {
          activePopup.remove();
          document.querySelectorAll('.essay-item').forEach(el => el.classList.remove('active'));
        }
      });

      // Cursor
      map.on('mouseenter', 'essays-markers', () => {
        map.getCanvas().style.cursor = 'pointer';
        map.setPaintProperty('essays-markers-hover', 'circle-opacity', 1);
      });
      map.on('mouseleave', 'essays-markers', () => {
        map.getCanvas().style.cursor = '';
        map.setPaintProperty('essays-markers-hover', 'circle-opacity', 0);
      });
    };

    if (map.isStyleLoaded()) { addLayers(); }
    else { map.on('load', addLayers); }

    // Build sidebar
    const list = document.getElementById('essayList');
    list.innerHTML = '';
    validEssays.forEach(e => {
      const li = document.createElement('li');
      li.className = 'essay-item';
      li.id = `essay-${e.id}`;
      li.innerHTML = `
        <div class="essay-inner">
          <span class="essay-lake-tag">${e.lake}</span>
          <div class="essay-title">${e.title}</div>
          <div class="essay-meta">by ${e.author} &middot; ${e.location}</div>
          <div class="essay-excerpt">${e.excerpt}</div>
          <a class="essay-link" href="${e.url}" target="_blank" rel="noopener">Read →</a>
        </div>
      `;
      li.addEventListener('click', () => {
        activateSidebarItem(e.id);
        map.flyTo({ center: [e.lng, e.lat], zoom: 8, speed: 1.2 });
        map.once('moveend', () => openPopup(e));
      });
      list.appendChild(li);
    });
  }

  loadEssays();
</script>

<style>
  @keyframes loading {
    from { transform: scaleX(0.2); }
    to   { transform: scaleX(1); }
  }
</style>
</body>
</html>
