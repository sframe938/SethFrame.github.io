<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>518 Eggrolls</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root {
    /* ---- "518 Rolls" palette ---- */
    --ink: #4d6058;        /* darkened sage, used for body text */
    --paper: #FEFEFE;
    --accent: #FC474C;     /* coral red — primary */
    --accent-soft: #E4777B;/* dusty rose — secondary accent, alt rows */
    --sage: #99AFA2;       /* sage — low end of score ramp */
    --sage-dark: #799B8A;  /* deep sage — muted text, borders */
    --gold: #C79A3D;       /* gold — marker ring, active states */
    --row-alt: #EEF3F0;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, Helvetica, sans-serif; color: var(--ink); }
  body { display: flex; flex-direction: column; }

  .view { display: none; }
  .view.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  #app { display: flex; flex: 1; min-height: 0; width: 100%; }

  /* ---------------- sidebar ---------------- */
  #sidebar {
    width: 320px;
    min-width: 320px;
    height: 100%;
    overflow-y: auto;
    background: var(--paper);
    border-right: 3px solid var(--accent);
  }
  #sidebar-header {
    background: var(--accent);
    color: #fff;
    padding: 16px 14px 12px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  #sidebar-header h1 {
    margin: 0;
    font-size: 19px;
    letter-spacing: 0.03em;
    font-weight: 800;
  }
  #sidebar-header p {
    margin: 4px 0 0;
    font-size: 11px;
    opacity: 0.9;
  }
  #reviewer-toggle {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  #reviewer-toggle button {
    flex: 1;
    padding: 5px 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: transparent;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 3px;
    cursor: pointer;
  }
  #reviewer-toggle button.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1a1a;
  }
  #reviewer-toggle button:hover:not(.active) { background: rgba(255,255,255,0.15); }

  #search-box {
    width: 100%;
    margin-top: 10px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    border: none;
    border-radius: 3px;
    box-sizing: border-box;
  }
  #search-box::placeholder { color: #999; }

  #surprise-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 8px;
    padding: 6px 12px;
    background: transparent;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.02em;
    border-radius: 3px;
    border: 2px solid #fff;
    cursor: pointer;
    width: 100%;
    justify-content: center;
  }
  #surprise-btn:hover { background: rgba(255,255,255,0.15); }

  #log-review-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    padding: 6px 12px;
    background: #fff;
    color: var(--accent);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-decoration: none;
    border-radius: 3px;
    border: 2px solid var(--gold);
  }
  #log-review-link:hover { background: #FFF6E8; }
  #restaurant-list { list-style: none; margin: 0; padding: 0; }
  .r-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .r-row:nth-child(even) { background: var(--row-alt); }
  .r-row:hover { background: rgba(228,119,123,0.18); }
  .r-row.active { background: var(--gold); color: #1a1a1a; }
  .r-num { font-weight: 800; opacity: 0.55; font-size: 11px; margin-right: 6px; }
  .r-name { font-size: 13px; font-weight: 600; }
  .r-city { font-size: 10px; opacity: 0.65; display: block; }
  .r-score {
    font-weight: 800;
    font-size: 13px;
    min-width: 30px;
    text-align: right;
  }
  .r-count { font-size: 9px; opacity: 0.6; display: block; text-align: right; }
  .r-empty { padding: 24px 16px; font-size: 12px; opacity: 0.6; text-align: center; }

  /* ---------------- map ---------------- */
  #map { flex: 1; height: 100%; }

  /* ---------------- popup ---------------- */
  .mapboxgl-popup-content {
    padding: 0 !important;
    border-radius: 2px !important;
    border: 3px solid var(--accent);
    overflow: hidden;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
  }
  .mapboxgl-popup-close-button {
    color: #fff;
    font-size: 18px;
    right: 4px;
    top: 2px;
  }
  .popup-head {
    background: var(--accent);
    color: #fff;
    padding: 8px 28px 8px 12px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .popup-addr {
    font-size: 11px;
    color: var(--sage-dark);
    padding: 6px 12px 0;
    display: block;
    text-decoration: none;
  }
  .popup-addr:hover { text-decoration: underline; }
  .popup-body { padding: 8px 12px 10px; }
  .popup-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px dotted #ccc;
  }
  .popup-row:last-of-type { border-bottom: none; }
  .popup-row span:last-child { font-weight: 700; }
  .popup-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid #eee;
  }
  .popup-count { font-size: 10px; opacity: 0.7; }
  .popup-stamp {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .popup-notes {
    font-size: 11px;
    font-style: italic;
    color: #555;
    margin-top: 6px;
  }

  #loading {
    position: absolute;
    top: 12px;
    left: 340px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 6px 12px;
    border-radius: 3px;
    font-size: 12px;
    z-index: 5;
  }

  .mapboxgl-ctrl-home {
    display: flex; align-items: center; justify-content: center;
    width: 29px; height: 29px; background: #fff; border: none;
    cursor: pointer; color: var(--ink); padding: 0;
  }
  .mapboxgl-ctrl-home:hover { background: var(--row-alt); }

  /* ---------------- top tab bar ---------------- */
  #top-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--ink);
    padding: 8px 14px;
    flex-wrap: wrap;
  }
  #top-bar .tab-btn {
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: transparent;
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  #top-bar .tab-btn.active { background: var(--accent); }
  #top-bar .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.15); }
  #top-bar-spacer { flex: 1; }
  #signin-area { display: flex; align-items: center; gap: 8px; }
  #signed-in-label {
    color: #fff;
    font-size: 12px;
    display: none;
  }

  /* ---------------- form views (Review / Add Restaurant / Suggest) ---------------- */
  .form-view {
    display: none;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    width: 100%;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }
  .form-view.active { display: block; }
  .form-view h2 {
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .form-view .form-sub {
    font-size: 13px;
    color: var(--sage-dark);
    margin-bottom: 20px;
  }
  .form-view label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin: 14px 0 4px;
  }
  .form-view select,
  .form-view input[type="text"],
  .form-view input[type="date"],
  .form-view input[type="number"],
  .form-view textarea {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 1.5px solid var(--sage);
    border-radius: 3px;
    box-sizing: border-box;
    font-family: inherit;
  }
  .form-view textarea { resize: vertical; min-height: 70px; }
  .form-view .rating-value {
    font-family: 'Segoe UI', monospace;
    font-weight: 700;
    color: var(--accent);
    float: right;
  }
  .form-view input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 4px; }
  .submit-btn {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.02em;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .form-msg {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 13px;
    display: none;
  }
  .form-msg.success { display: block; background: #E8F3EA; color: #2d5a35; }
  .form-msg.error { display: block; background: #FCE6E6; color: #9c2b2b; }
  .signin-required-note {
    font-size: 12px;
    color: var(--sage-dark);
    background: var(--row-alt);
    padding: 8px 10px;
    border-radius: 3px;
    margin-top: 16px;
  }

  /* ---------------- mobile ---------------- */
  @media (max-width: 680px) {
    #app { flex-direction: column; }
    #sidebar {
      width: 100%;
      min-width: 0;
      height: 45vh;
      border-right: none;
      border-bottom: 3px solid var(--accent);
    }
    #map { height: 55vh; }
    #loading { left: 12px; }
  }
</style>
</head>
<body>

<div id="top-bar">
  <button class="tab-btn active" data-view="map">Map</button>
  <button class="tab-btn" data-view="review">Review</button>
  <div id="top-bar-spacer"></div>
  <div id="signin-area">
    <span id="signed-in-label"></span>
    <div id="g_id_signin_container"></div>
  </div>
</div>

<div id="view-map" class="view active">
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-header">
        <h1>518 EGGROLLS</h1>
        <p>Capital District, NY</p>
        <div id="reviewer-toggle"></div>
        <input id="search-box" type="text" placeholder="Search restaurants or cities…" />
        <button id="surprise-btn" type="button">Surprise me</button>
        <a id="log-review-link" href="https://forms.gle/oiB696Sb8hZkNUWS8" target="_blank" rel="noopener">
          + Log a review
        </a>
      </div>
      <ul id="restaurant-list"><li class="r-empty">Loading restaurants…</li></ul>
    </div>
    <div id="map"></div>
  </div>
  <div id="loading" style="display:none;">Fetching latest reviews…</div>
</div>

<div id="view-review" class="form-view">
  <h2>Log a Review</h2>
  <div class="form-sub">Signed in and on the allowlist? Fill this out and it goes straight to the sheet.</div>

  <label>Restaurant</label>
  <select id="rv_restaurant"><option value="">Loading restaurants…</option></select>

  <label>Reviewer</label>
  <select id="rv_reviewer">
    <option value="Darlene">Darlene</option>
    <option value="Seth">Seth</option>
  </select>

  <label>Date Visited</label>
  <input id="rv_date" type="date" />

  <label>Dining</label>
  <select id="rv_dining">
    <option value="Eat-In">Eat-In</option>
    <option value="Carry-out">Carry-out</option>
    <option value="Leftover">Leftover</option>
  </select>

  <label>Price ($)</label>
  <input id="rv_price" type="number" step="0.01" placeholder="0.00" />

  <label>Crispiness <span id="rv_crisp_val" class="rating-value">7</span></label>
  <input id="rv_crisp" type="range" min="1" max="10" value="7" oninput="document.getElementById('rv_crisp_val').textContent=this.value" />

  <label>Flavor <span id="rv_flavor_val" class="rating-value">7</span></label>
  <input id="rv_flavor" type="range" min="1" max="10" value="7" oninput="document.getElementById('rv_flavor_val').textContent=this.value" />

  <label>Filling <span id="rv_filling_val" class="rating-value">7</span></label>
  <input id="rv_filling" type="range" min="1" max="10" value="7" oninput="document.getElementById('rv_filling_val').textContent=this.value" />

  <label>Size <span id="rv_size_val" class="rating-value">7</span></label>
  <input id="rv_size" type="range" min="1" max="10" value="7" oninput="document.getElementById('rv_size_val').textContent=this.value" />

  <label>Notes</label>
  <textarea id="rv_notes" placeholder="Extra crispy, generous filling…"></textarea>

  <button class="submit-btn" id="rv_submit" onclick="submitReview()">Save Review</button>
  <div id="rv_msg" class="form-msg"></div>
  <div id="rv_signin_note" class="signin-required-note" style="display:none;">Sign in above to submit a review.</div>
</div>

<script>
  // ---------------- CONFIG ----------------
  mapboxgl.accessToken = 'pk.eyJ1Ijoic2ZyYW1lOTM4IiwiYSI6ImNqN2RweG9ydjBkenIycWt5Z2c5NWtsajcifQ.bA0BviPhPcygQREBZd0cdQ';

  const STYLE_URL = 'mapbox://styles/sframe938/cmt05ag4a000901s40636cx0r';

  // Published Map Data tab, CSV output
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSM9qEiTB8KglBmd5NLpCZnYUrYLr0Q4X5n3UsQZgvf-4SUuDhK9xoXDHBV7tmEsSLQ7ZgwZCWZZ4O9/pub?gid=1326877444&single=true&output=csv';

  // Raw per-review data (Form Responses 1) — used to compute reviewer-filtered aggregates client-side
  const REVIEWS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSM9qEiTB8KglBmd5NLpCZnYUrYLr0Q4X5n3UsQZgvf-4SUuDhK9xoXDHBV7tmEsSLQ7ZgwZCWZZ4O9/pub?gid=1370775962&single=true&output=csv';

  const REVIEWERS = ['Darlene', 'Seth', 'Other'];

  // Capital District, NY
  const CENTER = [-73.80, 42.75];
  const ZOOM = 9.2;

  // Roughly the Capital District / 518 area-code footprint — Saratoga Springs
  // down through Albany/Troy/Schenectady. Adjust if you want it looser/tighter.
  const MAX_BOUNDS = [
    [-74.55, 42.25], // southwest
    [-73.05, 43.35]  // northeast
  ];
  const MIN_ZOOM = 8.5;
  const MAX_ZOOM = 16;

  // ---------------- MAP INIT ----------------
  const map = new mapboxgl.Map({
    container: 'map',
    style: STYLE_URL,
    center: CENTER,
    zoom: ZOOM,
    minZoom: MIN_ZOOM,
    maxZoom: MAX_ZOOM,
    maxBounds: MAX_BOUNDS
  });
  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  // ── Home control (matches the tour map's HomeControl) ──────────────────
  class HomeControl {
    onAdd(mapRef) {
      this._map = mapRef;
      this._container = document.createElement('div');
      this._container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group';
      this._container.innerHTML = `
        <button class="mapboxgl-ctrl-home" title="Return to full extent" aria-label="Return to full extent">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.5z"/>
            <polyline points="9 21 9 13 15 13 15 21"/>
          </svg>
        </button>`;
      this._container.querySelector('button').addEventListener('click', () => {
        activePopup.remove();
        document.getElementById('search-box').value = '';
        currentReviewer = 'all';
        renderReviewerToggle();
        applyFilters();

        if (locations.length) {
          const bounds = new mapboxgl.LngLatBounds();
          locations.forEach(l => {
            const lat = parseFloat(l['Latitude']);
            const lon = parseFloat(l['Longitude']);
            if (!isNaN(lat) && !isNaN(lon)) bounds.extend([lon, lat]);
          });
          map.fitBounds(bounds, { padding: 50, duration: 900 });
        } else {
          map.easeTo({ center: CENTER, zoom: ZOOM, duration: 900 });
        }
      });
      return this._container;
    }
    onRemove() { this._container.parentNode.removeChild(this._container); this._map = undefined; }
  }
  map.addControl(new HomeControl(), 'top-right');

  let markers = [];
  // Single shared popup instance — reused/repositioned on every click so
  // opening a new one automatically replaces whatever was open before.
  const activePopup = new mapboxgl.Popup({ offset: 16, closeOnClick: false });

  function buildPopupHTML(row) {
    const score = parseFloat(row['Avg Overall Score']);
    const count = parseInt(row['Number of Reviews'], 10) || 0;
    const scoreDisplay = isNaN(score) ? '—' : score.toFixed(1);

    const crisp = parseFloat(row['Avg Crispiness']);
    const flavor = parseFloat(row['Avg Flavor']);
    const filling = parseFloat(row['Avg Filling']);
    const size = parseFloat(row['Avg Size']);
    const price = parseFloat(row['Avg Price ($)']);

    const metricRow = (label, val, formatter) =>
      isNaN(val) ? '' : `<div class="popup-row"><span>${label}</span><span>${formatter ? formatter(val) : val.toFixed(1)}</span></div>`;

    const metrics = [
      metricRow('Crispiness', crisp),
      metricRow('Flavor', flavor),
      metricRow('Filling', filling),
      metricRow('Size', size),
      metricRow('Avg price', price, (v) => `$${v.toFixed(2)}`),
    ].join('');

    return `
      <div class="popup-head">${escapeHTML(row['Restaurant Name'] || '')}</div>
      <a class="popup-addr" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([row['Restaurant Name'], row['Address'], row['City']].filter(Boolean).join(', '))}" target="_blank" rel="noopener">
        ${escapeHTML([row['Address'], row['City']].filter(Boolean).join(', '))}
      </a>
      <div class="popup-body">
        ${metrics}
        <div class="popup-foot">
          <span class="popup-count">${count} review${count === 1 ? '' : 's'} logged</span>
          <span class="popup-stamp">${scoreDisplay}</span>
        </div>
        ${row['Last Reviewed'] ? `<div class="popup-notes">Last reviewed ${escapeHTML(row['Last Reviewed'])}</div>` : ''}
        ${row['Dining Summary'] ? `<div class="popup-notes">${escapeHTML(row['Dining Summary'])}</div>` : ''}
      </div>
    `;
  }

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function renderSidebar(rows) {
    const list = document.getElementById('restaurant-list');
    list.innerHTML = '';

    if (!rows.length) {
      list.innerHTML = '<li class="r-empty">No restaurants found in the sheet yet.</li>';
      return;
    }

    // sort by score desc, unscored restaurants at the bottom
    const sorted = [...rows].sort((a, b) => {
      const sa = parseFloat(a['Avg Overall Score']);
      const sb = parseFloat(b['Avg Overall Score']);
      if (isNaN(sa) && isNaN(sb)) return 0;
      if (isNaN(sa)) return 1;
      if (isNaN(sb)) return -1;
      return sb - sa;
    });

    sorted.forEach((row, i) => {
      const score = parseFloat(row['Avg Overall Score']);
      const count = parseInt(row['Number of Reviews'], 10) || 0;
      const li = document.createElement('li');
      li.className = 'r-row';
      li.dataset.name = row['Restaurant Name'];
      li.innerHTML = `
        <span>
          <span class="r-num">${String(i + 1).padStart(2, '0')}</span>
          <span class="r-name">${escapeHTML(row['Restaurant Name'] || '')}</span>
          <span class="r-city">${escapeHTML(row['City'] || '')}</span>
        </span>
        <span>
          <span class="r-score">${isNaN(score) ? '—' : score.toFixed(1)}</span>
          <span class="r-count">${count} rev.</span>
        </span>
      `;
      li.addEventListener('click', () => focusRestaurant(row));
      list.appendChild(li);
    });
  }

  function setActiveRow(name) {
    document.querySelectorAll('.r-row').forEach(el => el.classList.remove('active'));
    const target = [...document.querySelectorAll('.r-row')]
      .find(el => el.dataset.name === name);
    if (target) target.classList.add('active');
  }

  function openPopupFor(row) {
    const lat = parseFloat(row['Latitude']);
    const lon = parseFloat(row['Longitude']);
    if (isNaN(lat) || isNaN(lon)) return;
    activePopup.setLngLat([lon, lat]).setHTML(buildPopupHTML(row)).addTo(map);
    setActiveRow(row['Restaurant Name']);
  }

  function focusRestaurant(row) {
    const lat = parseFloat(row['Latitude']);
    const lon = parseFloat(row['Longitude']);
    if (isNaN(lat) || isNaN(lon)) return;

    setActiveRow(row['Restaurant Name']);
    map.flyTo({ center: [lon, lat], zoom: 13.5, speed: 0.9 });
    map.once('moveend', () => openPopupFor(row));
  }

  function plotMarkers(rows) {
    markers.forEach(m => m.remove());
    markers = [];

    rows.forEach(row => {
      const lat = parseFloat(row['Latitude']);
      const lon = parseFloat(row['Longitude']);
      if (isNaN(lat) || isNaN(lon)) return;

      const size = 34;

      // Wrapper is what Mapbox positions (it sets this element's transform
      // itself, so any rotation on the SAME element gets overwritten). The
      // diamond rotation lives on an inner element instead.
      const wrap = document.createElement('div');
      wrap.style.width = `${size}px`;
      wrap.style.height = `${size}px`;
      wrap.style.cursor = 'pointer';

      const inner = document.createElement('div');
      inner.style.width = '100%';
      inner.style.height = '100%';
      inner.style.background = '#FC474C';
      inner.style.border = '2px solid #fff';
      inner.style.boxShadow = '0 0 0 2px var(--gold), 0 1px 3px rgba(0,0,0,0.4)';
      inner.style.transform = 'rotate(45deg)';
      inner.style.display = 'flex';
      inner.style.alignItems = 'center';
      inner.style.justifyContent = 'center';

      const iconSize = Math.round(size * 0.62);
      inner.innerHTML = `
        <svg width="${iconSize}" height="${iconSize}" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             style="transform: rotate(-45deg);">
          <path d="M9 5c0-2 1.3-3 3-3s3 1 3 3"></path>
          <path d="M6 8h12l-1.4 12.1a1 1 0 0 1-1 .9H8.4a1 1 0 0 1-1-.9L6 8z"></path>
          <path d="M12 8v13"></path>
        </svg>
      `;
      wrap.appendChild(inner);

      wrap.addEventListener('click', (e) => {
        e.stopPropagation();
        openPopupFor(row);
      });

      const marker = new mapboxgl.Marker({ element: wrap, anchor: 'center' })
        .setLngLat([lon, lat])
        .addTo(map);

      markers.push(marker);
    });
  }

  let locations = [];   // Map Data rows — name/address/city/county/lat/lon only
  let reviews = [];     // Form Responses 1 rows — one per submitted review
  let allRows = [];     // computed: locations merged with aggregates for the current reviewer filter
  let currentReviewer = 'all';

  function parseCSVPromise(url) {
    return new Promise((resolve, reject) => {
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        transformHeader: (h) => h.trim(),
        complete: (results) => resolve(results.data),
        error: reject
      });
    });
  }

  function computeRows(reviewerFilter) {
    const filteredReviews = reviewerFilter === 'all'
      ? reviews
      : reviews.filter(r => (r['Reviewer'] || '').trim() === reviewerFilter);

    return locations
      .filter(loc => loc['Restaurant Name'])
      .map(loc => {
        const name = loc['Restaurant Name'];
        const forThis = filteredReviews.filter(r => (r['Restaurant'] || '').trim() === name.trim());

        const avg = (key) => {
          const nums = forThis.map(r => parseFloat(r[key])).filter(n => !isNaN(n));
          return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : NaN;
        };

        const crisp = avg('Crispiness');
        const flavor = avg('Flavor');
        const filling = avg('Filling');
        const size = avg('Size');
        const price = avg('Price ($)');
        const overallVals = forThis
          .map(r => {
            const c = parseFloat(r['Crispiness']), fl = parseFloat(r['Flavor']), f = parseFloat(r['Filling']), s = parseFloat(r['Size']);
            const vals = [c, fl, f, s].filter(n => !isNaN(n));
            return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : NaN;
          })
          .filter(n => !isNaN(n));
        const overall = overallVals.length ? overallVals.reduce((a, b) => a + b, 0) / overallVals.length : NaN;

        const dates = forThis.map(r => new Date(r['Date Visited'])).filter(d => !isNaN(d));
        const lastReviewed = dates.length
          ? new Date(Math.max(...dates)).toISOString().slice(0, 10)
          : '';

        // Dining type tally — informational only, not a filter yet.
        const diningCounts = {};
        forThis.forEach(r => {
          const dt = (r['Dining'] || '').trim();
          if (dt) diningCounts[dt] = (diningCounts[dt] || 0) + 1;
        });
        const diningSummary = Object.entries(diningCounts)
          .map(([type, n]) => `${type} ×${n}`)
          .join(', ');

        return {
          'Restaurant Name': name,
          'Address': loc['Address'],
          'City': loc['City'],
          'County': loc['County'],
          'Latitude': loc['Latitude'],
          'Longitude': loc['Longitude'],
          'Avg Overall Score': isNaN(overall) ? '' : overall,
          'Number of Reviews': forThis.length,
          'Avg Crispiness': isNaN(crisp) ? '' : crisp,
          'Avg Flavor': isNaN(flavor) ? '' : flavor,
          'Avg Filling': isNaN(filling) ? '' : filling,
          'Avg Size': isNaN(size) ? '' : size,
          'Avg Price ($)': isNaN(price) ? '' : price,
          'Last Reviewed': lastReviewed,
          'Dining Summary': diningSummary
        };
      });
  }

  function renderReviewerToggle() {
    const container = document.getElementById('reviewer-toggle');
    const options = ['All', ...REVIEWERS];
    container.innerHTML = options.map(opt => {
      const val = opt === 'All' ? 'all' : opt;
      const isActive = currentReviewer === val;
      return `<button type="button" data-val="${escapeHTML(val)}" class="${isActive ? 'active' : ''}">${escapeHTML(opt)}</button>`;
    }).join('');
    container.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        currentReviewer = btn.dataset.val;
        allRows = computeRows(currentReviewer);
        renderReviewerToggle();
        applyFilters();
      });
    });
  }

  function applyFilters() {
    const q = document.getElementById('search-box').value.trim().toLowerCase();
    const filtered = q
      ? allRows.filter(r =>
          (r['Restaurant Name'] || '').toLowerCase().includes(q) ||
          (r['City'] || '').toLowerCase().includes(q)
        )
      : allRows;
    renderSidebar(filtered);
    plotMarkers(filtered);
  }

  document.getElementById('search-box').addEventListener('input', applyFilters);

  document.getElementById('surprise-btn').addEventListener('click', () => {
    const withCoords = allRows.filter(r => !isNaN(parseFloat(r['Latitude'])) && !isNaN(parseFloat(r['Longitude'])));
    if (!withCoords.length) return;
    const unreviewed = withCoords.filter(r => (parseInt(r['Number of Reviews'], 10) || 0) === 0);
    const pool = unreviewed.length ? unreviewed : withCoords;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('search-box').value = '';
    applyFilters();
    focusRestaurant(pick);
  });

  function loadData() {
    document.getElementById('loading').style.display = 'block';
    Promise.all([parseCSVPromise(CSV_URL), parseCSVPromise(REVIEWS_CSV_URL)])
      .then(([locRows, reviewRows]) => {
        document.getElementById('loading').style.display = 'none';
        locations = locRows.filter(r => r['Restaurant Name']);
        reviews = reviewRows.filter(r => r['Restaurant']);
        allRows = computeRows(currentReviewer);
        renderReviewerToggle();
        applyFilters();
        populateReviewRestaurantDropdown();

        const bounds = new mapboxgl.LngLatBounds();
        locations.forEach(l => {
          const lat = parseFloat(l['Latitude']);
          const lon = parseFloat(l['Longitude']);
          if (!isNaN(lat) && !isNaN(lon)) bounds.extend([lon, lat]);
        });
        if (!bounds.isEmpty()) {
          map.fitBounds(bounds, { padding: 50, duration: 0 });
        }
      })
      .catch((err) => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('restaurant-list').innerHTML =
          '<li class="r-empty">Could not load data. Check the published CSV links.</li>';
        console.error('CSV load error:', err);
      });
  }

  map.on('load', loadData);

  // ---------------- TAB SWITCHING ----------------
  document.querySelectorAll('#top-bar .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#top-bar .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.view;

      document.getElementById('view-map').classList.remove('active');
      document.getElementById('view-review').classList.remove('active');

      if (target === 'map') {
        document.getElementById('view-map').classList.add('active');
        map.resize(); // Mapbox needs a nudge after being hidden/shown via display:none
      } else if (target === 'review') {
        document.getElementById('view-review').classList.add('active');
        if (!document.getElementById('rv_date').value) {
          document.getElementById('rv_date').value = new Date().toISOString().slice(0, 10);
        }
      }
    });
  });

  function populateReviewRestaurantDropdown() {
    const select = document.getElementById('rv_restaurant');
    const names = locations.map(l => l['Restaurant Name']).filter(Boolean).sort();
    select.innerHTML = '<option value="">Select a restaurant…</option>' +
      names.map(n => `<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join('');
  }

  // ---------------- GOOGLE SIGN-IN ----------------
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQX3nVdtQ7mm_hVoHibArwxkVYEeaO3Ol-nnFUebnee2yg045VKVCwpdvM0gfL2qDhyg/exec';
  const GOOGLE_CLIENT_ID = '204303957512-nv0v3eitsl0s08r9rov8ujg8fnpvffse.apps.googleusercontent.com';

  let currentIdToken = null;
  let currentSignedInEmail = null;

  function handleCredentialResponse(response) {
    currentIdToken = response.credential;
    const payload = JSON.parse(atob(currentIdToken.split('.')[1]));
    currentSignedInEmail = payload.email;

    const label = document.getElementById('signed-in-label');
    label.textContent = 'Signed in as ' + currentSignedInEmail;
    label.style.display = 'inline';

    document.getElementById('rv_submit').disabled = false;
    document.getElementById('rv_signin_note').style.display = 'none';
  }

  window.addEventListener('load', () => {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('g_id_signin_container'),
        { theme: 'filled_black', size: 'medium' }
      );
    }
    // Review submit starts disabled until sign-in completes.
    document.getElementById('rv_submit').disabled = true;
    document.getElementById('rv_signin_note').style.display = 'block';
  });

  // ---------------- REVIEW SUBMIT ----------------
  function showFormMsg(elId, type, text) {
    const el = document.getElementById(elId);
    el.className = 'form-msg ' + type;
    el.textContent = text;
  }

  async function submitReview() {
    if (!currentIdToken) {
      showFormMsg('rv_msg', 'error', 'Sign in first.');
      return;
    }
    const restaurant = document.getElementById('rv_restaurant').value;
    if (!restaurant) {
      showFormMsg('rv_msg', 'error', 'Pick a restaurant.');
      return;
    }

    const payload = {
      restaurant: restaurant,
      reviewer: document.getElementById('rv_reviewer').value,
      dateVisited: document.getElementById('rv_date').value,
      price: document.getElementById('rv_price').value,
      crispiness: document.getElementById('rv_crisp').value,
      flavor: document.getElementById('rv_flavor').value,
      filling: document.getElementById('rv_filling').value,
      size: document.getElementById('rv_size').value,
      notes: document.getElementById('rv_notes').value,
      dining: document.getElementById('rv_dining').value
    };

    const btn = document.getElementById('rv_submit');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    document.getElementById('rv_msg').className = 'form-msg';

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'review', idToken: currentIdToken, payload: payload })
      });
      const data = await res.json();
      if (data.success) {
        showFormMsg('rv_msg', 'success', 'Review saved!');
        document.getElementById('rv_notes').value = '';
        document.getElementById('rv_price').value = '';
      } else {
        showFormMsg('rv_msg', 'error', data.error || 'Something went wrong.');
      }
    } catch (err) {
      showFormMsg('rv_msg', 'error', 'Network error: ' + err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Review';
    }
  }
</script>
